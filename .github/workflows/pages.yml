name: Product site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for uploaded site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages uses the artifacts API, which can lag behind a successful upload.
          for attempt in $(seq 1 20); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' \
              | grep -qx '1'; then
              exit 0
            fi
            sleep 3
          done
          echo '::error::Uploaded Pages artifact did not become visible within 60 seconds.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
